name: CI

on:
  push:
    branches:
      - master
      - develop
      - "feat/**"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scoutlane
          POSTGRES_PASSWORD: scoutlane
          POSTGRES_DB: scoutlane
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is read from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deploy migrations (prod only)
        if: github.ref == 'refs/heads/master'
        run: pnpm prisma:deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://scoutlane:scoutlane@localhost:5432/scoutlane
          DIRECT_URL: postgresql://scoutlane:scoutlane@localhost:5432/scoutlane
          AUTH_SECRET: ci-test-secret-not-for-production
          NEXT_PUBLIC_APP_URL: http://localhost:3000
