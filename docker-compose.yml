version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: scoutlane-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: scoutlane
      POSTGRES_PASSWORD: scoutlane
      POSTGRES_DB: scoutlane
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
